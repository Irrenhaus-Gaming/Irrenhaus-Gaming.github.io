name: Build and Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/buildPages.yml'
      - 'templates/**'
      - 'page-generation/**'
      - 'assets/**'
      - 'wiki-sources/**'
      - 'images/**'
      - 'mkdocs.yml'
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

# Only needs to read the repo and publish the Pages artifact — no push back to main.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 mkdocs-material

      - name: Generate landing pages
        run: |
          python page-generation/generatePages.py

      - name: Build Wiki (MkDocs Material -> wiki/)
        run: |
          mkdocs build

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          # All generated landing + game pages live at the repo root as *.html.
          cp *.html _site/
          cp -r assets images wiki _site/

      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
