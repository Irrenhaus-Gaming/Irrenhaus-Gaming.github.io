site_name: Irrenhaus Gaming Wiki
site_description: Wiki und Anleitungen für die Irrenhaus Gaming Server.
site_author: Irrenhaus Gaming
site_url: https://irrenhaus-gaming.de/wiki/

# Reuse the existing Markdown sources; build into the /wiki/ subpath of the site.
docs_dir: wiki-sources
site_dir: wiki
use_directory_urls: true

# Files that live under docs_dir but must not be published as pages.
exclude_docs: |
  *.json
  sonstiges/inhaltsverzeichnis.md

theme:
  name: material
  language: de
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Source Sans Pro
    code: Source Code Pro
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Zum hellen Design wechseln
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Zum dunklen Design wechseln
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - assets/wiki-brand.css

extra:
  homepage: https://irrenhaus-gaming.de/
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.irrenhaus-gaming.de/
      name: Irrenhaus Gaming Discord

plugins:
  - search:
      lang: de

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Übersicht: index.md
  - Funktionen:
      - Cosmetics & Ränge: funktionen/cosmetics_ranks.md
      - Inventar & Backpacks: funktionen/inventar_backpacks.md
      - Mining: funktionen/mining.md
      - Quests: funktionen/quests.md
      - Verzauberungen: funktionen/verzauberungen.md
      - Gegenstände: funktionen/gegenstaende.md
      - Kleinigkeiten: funktionen/kleinigkeiten.md
  - Wirtschaft:
      - Moneten: wirtschaft/moneten.md
      - ChestShops: wirtschaft/chestshops.md
      - Adminshop: wirtschaft/adminshop.md
      - Auktionen: wirtschaft/auktionen.md
  - Kampf:
      - Monster & Skalierung: kampf/monstertypen.md
      - Elite-Mobs & Bosse: kampf/elite-mobs.md
      - Skills & Fähigkeiten: kampf/skills.md
      - Dungeons: kampf/dungeons.md
      - Strukturen: kampf/strukturen.md
      - Verzauberungen & Loot: kampf/verzauberungen-loot.md
      - Welt & Terrain: kampf/welt.md
  - Zuhause:
      - Home & Teleport: zuhause/home-und-teleport.md
      - Claims: zuhause/claims.md
      - Plots: zuhause/plots.md
  - Mods:
      - Map & Minimap: mods/map-minimap.md
      - Voicechat: mods/voicechat.md
  - Sonstiges:
      - Regeln: sonstiges/regeln.md
      - FAQ: sonstiges/faq.md
      - Glossar: sonstiges/glossar.md
      - Voting: sonstiges/voting.md
      - Quellen: sonstiges/quellen.md
